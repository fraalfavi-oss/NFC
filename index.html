<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta http-equiv="refresh" content="0; url=https://valvergroup.com/es/">
  <meta name="theme-color" content="#0a1925">
  <title>Valver Group | Acceso NFC</title>
  <style>
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;display:grid;place-items:center;background:#09131c;color:#fff;font:16px/1.6 system-ui,-apple-system,Segoe UI,sans-serif;text-align:center;padding:24px}
    main{max-width:440px}
    .mark{width:68px;height:68px;margin:0 auto 24px;border:2px solid #42d8b5;border-radius:20px;display:grid;place-items:center;font-size:28px;animation:pulse 1.5s ease-in-out infinite}
    h1{font-size:clamp(25px,5vw,34px);margin:0 0 6px}
    p{color:#b8cbd1;margin:0 0 24px}
    a{display:inline-block;color:#09131c;background:#51e0ba;border-radius:999px;font-weight:700;text-decoration:none;padding:13px 26px}
    a:focus-visible{outline:3px solid #fff;outline-offset:4px}
    @keyframes pulse{50%{box-shadow:0 0 25px #42d8b544}}
    @media(prefers-reduced-motion:reduce){.mark{animation:none}}
  </style>
  <script>window.location.replace("https://valvergroup.com/es/");</script>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">↗</div>
    <h1>VALVER GROUP</h1>
    <p>Te estamos llevando a la web oficial de Valver.</p>
    <a href="https://valvergroup.com/es/">Entrar en Valver</a>
  </main>
</body>
</html>
